<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAZEHANA · Crónicas del Camino</title>
<meta name="description" content="RPG de anime en el navegador: crea tu personaje, explora, lucha, enamórate y forma una familia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* KAZEHANA · tema "linterna de papel sobre noche índigo" */
:root {
  --ink: #120f26; --ink2: #1b1736; --ink3: #251f48; --line: #3a3366;
  --paper: #efe6d6; --muted: #a79fc4; --sakura: #f28fb5; --sakura2: #ffc2d6;
  --lantern: #f2b35a; --moss: #5fc4a8; --vermilion: #e0523f; --sky: #6aa7ff;
  --hp: #e05a6a; --en: #4f9bff; --xp: #f2c14e;
  --r: 14px; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --font-d: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
  --font-b: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font-family: var(--font-b); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body { background: radial-gradient(1200px 700px at 80% -10%, #2d2560 0%, transparent 60%), radial-gradient(900px 600px at 0% 110%, #3a1f4d 0%, transparent 55%), var(--ink); }
h1, h2, h3, h4, h5 { font-family: var(--font-d); margin: 0; }
h4 { margin: 16px 0 6px; font-size: 15px; color: var(--lantern); letter-spacing: .02em; }
h5 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-family: var(--font-b); }
p { margin: 6px 0; }
small { color: var(--muted); font-size: 12px; display: block; }
.muted { color: var(--muted); } .center { text-align: center; } .ok { color: var(--moss); } .bad { color: var(--hp); } .warn { color: var(--lantern); }
.hint { color: var(--muted); font-size: 13px; background: rgba(255, 255, 255, .04); border-left: 3px solid var(--line); padding: 6px 10px; border-radius: 6px; }
.quote { font-family: var(--font-d); font-style: italic; color: var(--sakura2); border-left: 3px solid var(--sakura); padding-left: 10px; }
.story { font-family: var(--font-d); font-size: 16px; line-height: 1.6; }
.screen { display: none; min-height: 100%; } .screen.active { display: block; }
#game.active { display: flex; flex-direction: column; height: 100dvh; }

/* ---------- Botones ---------- */
.btn { font: 600 14px var(--font-b); color: var(--paper); background: var(--ink3); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; transition: transform .08s, background .15s, border-color .15s; margin: 3px 4px 3px 0; text-align: left; }
.btn:hover:not(:disabled) { background: #2f2860; border-color: var(--sakura); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled, .btn.dim { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #f6a0c0, #e7709b); color: #2a0f1e; border-color: #ffd0e0; box-shadow: 0 4px 14px rgba(242, 143, 181, .3); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ffb2cd, #f282ab); }
.btn.ghost { background: transparent; } .btn.danger { background: #6b1f2a; border-color: var(--vermilion); }
.btn.big { padding: 13px 20px; font-size: 16px; } .btn.mini { padding: 5px 10px; font-size: 12.5px; }
.btn.glow, .glow-t { animation: glow 1.4s ease-in-out infinite; } .glow-t { color: var(--lantern); }
@keyframes glow { 50% { box-shadow: 0 0 14px var(--lantern); border-color: var(--lantern); } }
.chips { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0; align-items: center; }
.chips.big .btn { flex: 1 1 120px; text-align: center; padding: 12px 8px; }
.chip { font: 500 13px var(--font-b); color: var(--paper); background: var(--ink2); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; margin: 3px 4px 3px 0; cursor: pointer; }
.chip.on { background: var(--sakura); color: #2a0f1e; border-color: var(--sakura2); font-weight: 700; }

/* ---------- Título ---------- */
#title { position: relative; overflow: hidden; display: none; }
#title.active { display: grid; place-items: center; min-height: 100dvh; padding: 20px; }
.title-art .moon { position: absolute; right: 12%; top: 8%; width: min(26vw, 220px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6e0, #f2d9a0 60%, #d9b46c); box-shadow: 0 0 90px 30px rgba(242, 217, 160, .25); }
.petal { position: absolute; top: -20px; width: 12px; height: 9px; background: var(--sakura); border-radius: 80% 0 80% 0; opacity: .8; animation: fall linear infinite; }
.p1 { left: 10%; animation-duration: 9s; } .p2 { left: 30%; animation-duration: 12s; animation-delay: -4s; } .p3 { left: 55%; animation-duration: 10s; animation-delay: -2s; } .p4 { left: 75%; animation-duration: 14s; animation-delay: -7s; } .p5 { left: 90%; animation-duration: 11s; animation-delay: -5s; }
@keyframes fall { to { transform: translate(60px, 110vh) rotate(540deg); } }
.title-box { position: relative; max-width: 560px; width: 100%; background: linear-gradient(180deg, rgba(37, 31, 72, .85), rgba(18, 15, 38, .9)); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; box-shadow: var(--shadow); backdrop-filter: blur(6px); }
.kicker { letter-spacing: .3em; font-size: 12px; color: var(--lantern); text-transform: uppercase; margin: 0; }
.title-box h1 { font-size: clamp(44px, 9vw, 78px); letter-spacing: .12em; font-weight: 800; background: linear-gradient(180deg, #fff, var(--sakura2) 55%, var(--sakura)); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 4px 0 8px; }
.tag { color: var(--muted); max-width: 44ch; }
.title-actions { margin: 20px 0 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.saves { margin-top: 14px; display: grid; gap: 8px; }
.saverow { display: flex; align-items: center; gap: 6px; background: var(--ink2); border: 1px solid var(--line); padding: 8px 10px; border-radius: 12px; } .saverow > div { flex: 1; }
.foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); }

/* ---------- Creación ---------- */
.create-wrap { max-width: 1040px; margin: 0 auto; padding: 18px; display: grid; grid-template-columns: 230px 1fr; gap: 20px; }
.create-side { position: sticky; top: 14px; align-self: start; }
.cc-preview { background: var(--ink2); border: 1px solid var(--line); border-radius: 18px; padding: 8px; display: grid; place-items: center; box-shadow: var(--shadow); }
.create-body { background: linear-gradient(180deg, rgba(37, 31, 72, .7), rgba(18, 15, 38, .7)); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 22px; min-height: 70vh; }
.create-body h3 { font-size: 24px; margin-bottom: 8px; }
.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: 0 0 14px; counter-reset: s; }
.steps li { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--ink2); color: var(--muted); border: 1px solid var(--line); counter-increment: s; } .steps li::before { content: counter(s) '. '; }
.steps li.on { background: var(--lantern); color: #2a1b05; font-weight: 700; } .steps li.done { color: var(--moss); }
label { display: block; margin: 10px 0; font-size: 13px; color: var(--muted); }
input[type=text], input[type=number], textarea { width: 100%; margin-top: 4px; background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 500 15px var(--font-b); } input:focus, textarea:focus { outline: 2px solid var(--sakura); border-color: transparent; }
textarea { resize: vertical; }
.row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; } .row > * { flex: 1 1 200px; }
.lbl { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 14px 0 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; } .sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; } .sw.on { border-color: #fff; box-shadow: 0 0 0 3px var(--sakura); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; } .cards.small { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.card { text-align: left; font: inherit; color: var(--paper); background: var(--ink2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: .12s; --pc: var(--sakura); }
.card:hover { border-color: var(--pc); transform: translateY(-2px); } .card.on { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 16%, var(--ink2)); box-shadow: 0 0 0 2px var(--pc); }
.card b { font-family: var(--font-d); font-size: 16px; } .card em { font-size: 12px; color: var(--lantern); font-style: normal; }
.stats-alloc .srow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); } .sctl { display: flex; align-items: center; gap: 8px; } .sctl b { min-width: 28px; text-align: center; font-size: 17px; }
.summary p { margin: 8px 0; }
.wiz-nav { display: flex; justify-content: space-between; margin-top: 22px; gap: 8px; }

/* ---------- HUD ---------- */
#hud { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: linear-gradient(180deg, #1d1840, #151231); border-bottom: 1px solid var(--line); }
.hud-id b { font-family: var(--font-d); font-size: 18px; } .hud-bars { display: grid; gap: 3px; min-width: 190px; flex: 1 1 200px; max-width: 300px; }
.bar { position: relative; height: 15px; border-radius: 8px; background: rgba(0, 0, 0, .45); overflow: hidden; border: 1px solid rgba(255, 255, 255, .08); } .bar i { display: block; height: 100%; transition: width .3s; } .bar span { position: absolute; inset: 0; text-align: center; font: 700 10.5px/15px var(--font-b); text-shadow: 0 1px 2px #000; }
.bar.hp i { background: linear-gradient(90deg, #c23a4d, var(--hp)); } .bar.en i { background: linear-gradient(90deg, #2d6fd6, var(--en)); } .bar.xp { height: 9px; } .bar.xp i { background: var(--xp); } .bar.xp span { font-size: 8px; line-height: 9px; }
.hud-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; flex: 2 1 260px; } .hud-btns { margin-left: auto; display: flex; gap: 2px; }
#layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(360px, 1.15fr) minmax(340px, 1fr); gap: 12px; padding: 12px; }
#viewport { display: flex; flex-direction: column; gap: 8px; min-height: 0; align-items: center; }
#map { width: 100%; max-width: 720px; aspect-ratio: 15/11; border-radius: 14px; border: 2px solid var(--line); box-shadow: var(--shadow); image-rendering: pixelated; cursor: pointer; background: #0f0c20; }
.vp-row { display: flex; gap: 12px; align-items: center; width: 100%; max-width: 720px; justify-content: space-between; }
#minimap { width: 150px; border-radius: 8px; border: 1px solid var(--line); image-rendering: pixelated; }
#dpad { display: grid; grid-template: 'a u b' 44px 'l . r' 44px 'c d e' 44px / 52px 52px 52px; gap: 2px; } .dp { margin: 0; text-align: center; padding: 0; font-size: 16px; } .dp.up { grid-area: u; } .dp.left { grid-area: l; } .dp.right { grid-area: r; } .dp.down { grid-area: d; }
#quicktabs { display: flex; flex-wrap: wrap; gap: 2px; width: 100%; max-width: 720px; }
.panel { background: linear-gradient(180deg, rgba(37, 31, 72, .92), rgba(21, 18, 45, .95)); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow-y: auto; min-height: 0; position: relative; }
.panel-head { position: sticky; top: 0; z-index: 2; padding: 12px 18px; background: linear-gradient(180deg, #2a2354, #241e4c); border-bottom: 1px solid var(--line); border-radius: 16px 16px 0 0; } .panel-head h2 { font-size: 20px; }
.panel::before { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 16px; background: repeating-linear-gradient(90deg, transparent 0 59px, rgba(255, 255, 255, .02) 59px 60px); }
.panel-body { padding: 6px 18px 18px; }
.panel.event .panel-head { background: linear-gradient(180deg, #4a2a58, #3a2048); } .panel.combat .panel-head { background: linear-gradient(180deg, #5a2330, #431b28); } .panel.dungeon .panel-head { background: linear-gradient(180deg, #2a2a4a, #1c1c36); } .panel.story .panel-head { background: linear-gradient(180deg, #5a4a24, #44381c); }
.tileinfo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; font-size: 16px; } .near { list-style: none; padding: 0; margin: 0; } .near li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.mini-log p { margin: 3px 0; font-size: 13px; color: #cfc6e6; } .mini-log .love { color: var(--sakura2); } .mini-log .quest { color: var(--moss); } .mini-log .bad { color: var(--hp); } .mini-log .story { color: var(--lantern); }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
.place { background: var(--ink2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; color: var(--paper); font: inherit; cursor: pointer; text-align: center; display: grid; gap: 2px; transition: .12s; } .place:hover { border-color: var(--lantern); transform: translateY(-2px); } .place span { font-size: 26px; } .place b { font-family: var(--font-d); }
.npclist { display: grid; gap: 6px; } .npccard { display: flex; gap: 10px; align-items: center; background: var(--ink2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px 6px 6px; color: var(--paper); font: inherit; text-align: left; cursor: pointer; } .npccard:hover { border-color: var(--sakura); } .npccard .portrait { border-radius: 10px; flex: none; } .npccard span { display: grid; gap: 1px; }
.hearts { color: var(--sakura); letter-spacing: 2px; font-style: normal; } .hearts span { color: var(--line); } .hearts.big { font-size: 20px; } .hearts small { display: inline; letter-spacing: 0; }
.item, .quest { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); } .item small, .quest small { display: block; } .quest { flex-wrap: wrap; } .quest > b { flex: 1 1 100%; } .quest.done { opacity: .5; } .quest.ready b { color: var(--moss); }
.eff { margin: 8px 0; padding-left: 18px; color: var(--lantern); } .choices .btn { display: block; width: 100%; padding: 11px 14px; }

/* ---------- Diálogo ---------- */
.npc-view { display: grid; grid-template-columns: 210px 1fr; gap: 16px; } .npc-left { text-align: center; } .npc-left h3 { margin-top: 6px; font-size: 20px; } .npc-left details, .npc-left .info { text-align: left; }
.portrait-wrap { position: relative; display: inline-block; border-radius: 18px; overflow: hidden; border: 2px solid var(--line); box-shadow: var(--shadow); } .portrait { display: block; max-width: 100%; height: auto; } .moodchip { position: absolute; left: 6px; bottom: 6px; background: rgba(10, 8, 26, .8); border-radius: 99px; padding: 2px 10px; font-size: 12px; backdrop-filter: blur(4px); }
.portrait-wrap.mood-enamorado, .portrait-wrap.mood-coqueto { border-color: var(--sakura); box-shadow: 0 0 24px rgba(242, 143, 181, .45); } .portrait-wrap.mood-enfadado { border-color: var(--hp); } .portrait-wrap.mood-triste { border-color: var(--sky); }
.attr { font-size: 13px; color: var(--sakura2); margin: 4px 0; } details { margin: 6px 0; background: rgba(0, 0, 0, .2); border-radius: 10px; padding: 6px 10px; } summary { cursor: pointer; color: var(--lantern); font-size: 13px; } .desc { font-size: 13.5px; line-height: 1.5; }
.info { list-style: none; padding: 0; margin: 6px 0; font-size: 12.5px; } .info li { padding: 2px 0; } .meter { display: inline-block; width: 80px; height: 8px; border-radius: 6px; background: rgba(0, 0, 0, .4); overflow: hidden; vertical-align: middle; } .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--sakura), #ff5c8a); }
.chatlog { height: 270px; overflow-y: auto; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 92%; animation: pop .25s ease-out; } .msg.npc { align-self: flex-start; background: #2e2760; border-radius: 4px 14px 14px 14px; padding: 8px 12px; } .msg.npc i { display: block; font-size: 12.5px; color: var(--sakura2); margin-bottom: 2px; } .msg.npc p, .msg.me p { margin: 0; font-family: var(--font-d); font-size: 15px; }
.msg.me { align-self: flex-end; background: #4a2a58; border-radius: 14px 4px 14px 14px; padding: 8px 12px; } .msg.sys { align-self: center; text-align: center; font-size: 12.5px; color: var(--lantern); background: rgba(242, 179, 90, .08); border-radius: 99px; padding: 4px 12px; max-width: 100%; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }
.actions { margin-top: 8px; }

/* ---------- Combate ---------- */
.enemies { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
.enemy { position: relative; flex: 1 1 120px; max-width: 190px; background: var(--ink2); border: 2px solid var(--line); border-radius: 14px; padding: 10px; color: var(--paper); font: inherit; cursor: pointer; text-align: center; } .enemy.target { border-color: var(--lantern); box-shadow: 0 0 16px rgba(242, 179, 90, .35); } .enemy.dead { opacity: .3; filter: grayscale(1); pointer-events: none; } .enemy.boss { border-color: var(--vermilion); } .enemy .emoji { font-size: 44px; line-height: 1.1; animation: bob 2.4s ease-in-out infinite; } .enemy.boss .emoji { font-size: 60px; } @keyframes bob { 50% { transform: translateY(-4px); } } .sts { min-height: 18px; }
.pcard { position: relative; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; } .bars2 { display: grid; gap: 3px; margin-top: 4px; }
.float { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font: 800 24px var(--font-d); color: #fff; text-shadow: 0 2px 6px #000, 0 0 10px var(--hp); animation: up 1s ease-out forwards; pointer-events: none; } .float.crit { color: var(--lantern); font-size: 32px; } .float.heal { text-shadow: 0 2px 6px #000, 0 0 10px var(--moss); color: #b8ffe6; } @keyframes up { to { transform: translate(-50%, -46px); opacity: 0; } }
.clog { max-height: 130px; overflow-y: auto; margin: 10px 0; padding: 8px 10px; background: rgba(0, 0, 0, .25); border-radius: 10px; font-size: 13px; } .clog p { margin: 2px 0; } .clog .bad { color: #ff9aa6; } .clog .good { color: var(--moss); } .clog .skill { color: var(--sakura2); }
.cend { margin-top: 12px; padding: 14px; background: rgba(242, 179, 90, .08); border: 1px solid var(--lantern); border-radius: 14px; } .cend h3 { margin-bottom: 6px; }
.dgbar { display: flex; gap: 6px; margin: 10px 0; } .dgbar i { flex: 1; height: 10px; border-radius: 6px; background: var(--ink); border: 1px solid var(--line); } .dgbar i.done { background: var(--moss); } .dgbar i.cur { background: var(--lantern); animation: glow 1.4s infinite; } .dgbar i.boss { border-color: var(--vermilion); }

/* ---------- Modales ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(5, 4, 14, .78); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 12px; } .modal.hidden { display: none; }
.modal-box { width: min(880px, 100%); max-height: calc(100dvh - 24px); display: flex; flex-direction: column; background: linear-gradient(180deg, #251f48, #17132f); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.modal-tabs { display: flex; overflow-x: auto; background: #1d1840; border-bottom: 1px solid var(--line); } .tab { font: 600 13px var(--font-b); color: var(--muted); background: none; border: 0; padding: 12px 14px; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; } .tab.on { color: var(--paper); border-color: var(--sakura); } .tab.close { margin-left: auto; }
.modal-body { padding: 8px 18px 20px; overflow-y: auto; }
.char-grid { display: grid; grid-template-columns: 200px 1fr; gap: 20px; } .char-side { text-align: center; } .char-side .portrait { margin: 0 auto; border-radius: 16px; border: 2px solid var(--line); }
.equip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .slot { background: var(--ink); border: 1px dashed var(--line); border-radius: 10px; padding: 8px; color: var(--paper); font: inherit; cursor: pointer; text-align: left; } .slot small { text-transform: uppercase; letter-spacing: .1em; font-size: 10px; }
.skill { padding: 6px 0; border-bottom: 1px dashed var(--line); } .skill.lock { opacity: .45; }

<script>
/* KAZEHANA · utilidades base (RNG con semilla, helpers) */
(function (G) {
  'use strict';
  const U = (G.U = {});

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Generador aleatorio. Con semilla = reproducible (mundo/NPCs); sin semilla = Math.random
  U.mkRng = function (seed) {
    const f = seed == null ? Math.random : mulberry32(seed >>> 0);
    const R = {
      r: f,
      ri: (a, b) => a + Math.floor(f() * (b - a + 1)),
      pick: (arr) => arr[Math.floor(f() * arr.length)],
      chance: (p) => f() < p,
      shuffle: (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
      },
      wpick: (arr, wf) => {
        let tot = 0; const ws = arr.map((x) => { const w = Math.max(0, wf(x)); tot += w; return w; });
        let r = f() * tot;
        for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
        return arr[arr.length - 1];
      },
    };
    return R;
  };
  U.R = U.mkRng();

  U.hash = function (str) {
    let h = 2166136261;
    str = String(str);
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  U.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let _uid = 0;
  U.uid = (p) => (p || 'id') + Date.now().toString(36) + (_uid++).toString(36) + Math.floor(Math.random() * 1e4).toString(36);
  U.deep = (o) => JSON.parse(JSON.stringify(o));
  U.sum = (a) => a.reduce((s, x) => s + x, 0);
  U.pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

  // Sustitución de marcadores en textos: {p} jugador, {n} npc, {o} o/a del jugador, {x} o/a del npc ...
  U.fill = function (str, ctx) {
    ctx = ctx || {};
    return String(str).replace(/\{(\w+)\}/g, (m, k) => (ctx[k] != null ? ctx[k] : m));
  };
})((window.G = window.G || {}));

/* KAZEHANA · servicios: base de datos local (IndexedDB con respaldo en localStorage) y sonido sintetizado */
(function (G) {
  'use strict';

  const DB_NAME = 'kazehana-db', STORE = 'saves';
  const mem = {};

    if (dbp) return dbp;

        rq.onupgradeneeded = () => rq.result.createObjectStore(STORE);
        rq.onsuccess = () => resolve(rq.result);

    });

  }
  function lsGet(k) { try { return localStorage.getItem('kazehana:' + k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem('kazehana:' + k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem('kazehana:' + k); } catch (e) {} }

  const Storage = (G.Storage = {
    async save(slot, data) {
      const json = JSON.stringify(data);
      const db = await openDB();
      if (db) {
        try {
          await new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(json, slot); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
          return 'idb';
        } catch (e) { /* cae al respaldo */ }
      }
      if (lsSet(slot, json)) return 'ls';
      mem[slot] = json; return 'mem';
    },
    async load(slot) {
      const db = await openDB();
      let json = null;
      if (db) {
        try { json = await new Promise((res, rej) => { const rq = db.transaction(STORE).objectStore(STORE).get(slot); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); } catch (e) {}
      }
      if (!json) json = lsGet(slot);
      if (!json) json = mem[slot] || null;
      try { return json ? JSON.parse(json) : null; } catch (e) { return null; }
    },
    async remove(slot) {

    const v = (vol || 0.2) * G.Settings.data.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }

    play(name) {
      switch (name) {
        case 'click': tone(660, 0.05, 'triangle', 0.15); break;
        case 'step': tone(180, 0.04, 'sine', 0.06); break;
        case 'hit': tone(220, 0.12, 'sawtooth', 0.25, 0, 70); break;
        case 'crit': tone(300, 0.18, 'sawtooth', 0.3, 0, 60); tone(900, 0.1, 'square', 0.15, 0.02); break;
        case 'hurt': tone(140, 0.2, 'square', 0.2, 0, 50); break;
        case 'magic': tone(500, 0.3, 'sine', 0.2, 0, 1200); tone(750, 0.25, 'triangle', 0.1, 0.05, 1500); break;
        case 'heal': [523, 659, 784].forEach((f, i) => tone(f, 0.18, 'sine', 0.18, i * 0.08)); break;
        case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.2, i * 0.1)); break;

<script>
/* KAZEHANA · combate por turnos (sin DOM) */
(function (G) {
  'use strict';
  const D = G.D, U = G.U, Game = G.Game;
  const C = (G.Combat = {});
  const rnd = () => U.R.r();

  C.makeEnemy = function (id, lvl, extra) {
    const b = D.ENEMIES[id], f = Math.max(0, lvl - ((b.tier - 1) * 3 + 1));
    const hp = Math.round(b.hp * (1 + 0.24 * f));
    const e = {
      uid: U.uid('e'), id, n: b.n, e: b.e, lvl, hp, maxHp: hp, atk: Math.round(b.atk * (1 + 0.17 * f)), def: Math.round(b.def * (1 + 0.12 * f)), spd: b.spd + Math.floor(f / 2),
      xp: Math.round(b.xp * (1 + 0.28 * f)), gold: Math.round(b.gold * (1 + 0.2 * f)), skills: b.skills, drops: b.drops, human: !!b.human, boss: !!b.boss, st: {},
    };
    return Object.assign(e, extra || {});
  };

  // opts: {noFlee, duel:{npc}, title}
  C.begin = function (group, opts) {
    const s = G.S, P = s.player; opts = opts || {};
    const enemies = group.map((g) => C.makeEnemy(g.id, g.lvl, g.extra));
    s.combat = { enemies, target: 0, turn: 1, log: [], done: null, opts, pst: {}, defending: false, fx: [] };
    const d = Game.derived(P); P.hp = Math.min(P.hp, d.maxHp);
    C.say('⚔️ ' + (enemies.length > 1 ? 'Te enfrentas a ' + enemies.map((e) => e.n).join(', ') : 'Te enfrentas a ' + enemies[0].n + ' (nv. ' + enemies[0].lvl + ')') + '.');
    return s.combat;
  };
  C.say = (t, cls) => { const c = G.S.combat; if (c) c.log.push({ t, c: cls || '' }); };
  C.alive = () => G.S.combat.enemies.filter((e) => e.hp > 0);
  C.target = function () { const c = G.S.combat; let t = c.enemies[c.target]; if (!t || t.hp <= 0) { t = C.alive()[0]; c.target = c.enemies.indexOf(t); } return t; };
  C.setTarget = (i) => { const c = G.S.combat; if (c.enemies[i] && c.enemies[i].hp > 0) c.target = i; };

  function addStatus(st, id, t) { st[id] = Math.max(st[id] || 0, t); }
  function dotDmg(lvl) { return 4 + Math.round(lvl * 1.6); }

  function hitEnemy(e, dmg, tag) {
    e.hp = Math.max(0, e.hp - dmg);
    C.G.fx.push({ k: 'e', uid: e.uid, v: dmg, crit: tag === 'crit' });
    if (e.hp <= 0) C.say('💀 ' + e.n + ' cae derrotado.', 'good');
  }
  C.pdmg = function (stat, mult, target) {
    const P = G.S.player, d = Game.derived(P), c = G.S.combat;
    let base = stat === 'mag' ? d.mag : d.atk;
    base *= mult * (0.9 + rnd() * 0.2) * (1 + 0.08 * P.powerRank);
    if (c.pst.atkup) base *= 1.35; if (c.pst.weak) base *= 0.7;
    let crit = rnd() * 100 < d.crit; if (crit) base *= 1.6;
    if (target.st.weak) base *= 1.1;
    let dmg = Math.max(1, Math.round(base - target.def * 0.55));
    return { dmg, crit };
  };
  Object.defineProperty(C, 'G', { get: () => G.S.combat });

  /* ---- acciones del jugador ---- */
  C.playerAct = function (kind, arg) {
    const s = G.S, c = s.combat, P = s.player, d = Game.derived(P);
    if (!c || c.done) return c;
    c.fx = []; let acted = true;
    if (c.pst.stun || c.pst.freeze) { C.say('💫 No puedes moverte este turno.', 'bad'); }
    else if (kind === 'attack') {
      const t = C.target(); const r = C.pdmg('atk', 1.0, t);
      if (rnd() < 0.04 + Math.max(0, (t.spd - d.spd)) * 0.004) { C.say('💨 ' + t.n + ' esquiva tu ataque.'); G.Sfx.play('click'); }
      else { hitEnemy(t, r.dmg, r.crit ? 'crit' : ''); C.say('🗡️ Golpeas a ' + t.n + ' y le causas ' + r.dmg + (r.crit ? ' (¡crítico!)' : '') + '.'); G.Sfx.play(r.crit ? 'crit' : 'hit'); }
      P.en = Math.min(d.maxEn, P.en + 2);
    } else if (kind === 'skill') {
      const sk = Game.skills(P).find((x) => x.id === arg);
      if (!sk) acted = false;
      else if (P.en < sk.cost) { C.say('🔷 No tienes energía suficiente.', 'bad'); acted = false; }
      else {
        P.en -= sk.cost; const stat = sk.stat || D.POWERS[P.power].stat;
        C.say('✨ Usas ' + sk.n + '.', 'skill'); G.Sfx.play(sk.t === 'heal' ? 'heal' : 'magic');
        if (sk.t === 'heal') { const h = Math.round(d.mag * sk.m * (1 + 0.08 * P.powerRank)); const before = P.hp; P.hp = Math.min(d.maxHp, P.hp + h); C.say('💚 Recuperas ' + (P.hp - before) + ' de vida.', 'good'); c.fx.push({ k: 'p', v: -(P.hp - before) }); }
        else if (sk.t === 'buff') { addStatus(c.pst, sk.buff.id, sk.buff.t + 1); C.say(D.STATUS[sk.buff.id].e + ' ' + D.STATUS[sk.buff.id].n + ' durante ' + sk.buff.t + ' turnos.', 'good'); }
        else {
          const targets = sk.aoe ? C.alive() : [C.target()]; let totalDmg = 0;
          targets.forEach((t) => {
            const r = C.pdmg(stat, sk.m, t); totalDmg += r.dmg; hitEnemy(t, r.dmg, r.crit ? 'crit' : '');
            C.say('  → ' + t.n + ': ' + r.dmg + (r.crit ? ' (¡crítico!)' : ''));
            if (sk.st && t.hp > 0 && rnd() < sk.st.p && !(t.boss && D.STATUS[sk.st.id].skip && rnd() < 0.5)) { addStatus(t.st, sk.st.id, sk.st.t + 1); C.say('  ' + D.STATUS[sk.st.id].e + ' ' + t.n + ': ' + D.STATUS[sk.st.id].n); }
          });
          if (sk.t === 'drain') { const h = Math.round(totalDmg * 0.5); P.hp = Math.min(d.maxHp, P.hp + h); C.say('🩸 Absorbes ' + h + ' de vida.', 'good'); }
          if (sk.sh) { const h = Math.round(totalDmg * sk.sh); P.hp = Math.min(d.maxHp, P.hp + h); C.say('💚 Te curas ' + h + '.', 'good'); }
        }
      }
    } else if (kind === 'defend') { c.defending = true; P.en = Math.min(d.maxEn, P.en + 5); C.say('🛡️ Te pones en guardia y recuperas el aliento.'); G.Sfx.play('click'); }
    else if (kind === 'item') {
      const it = D.ITEMS[arg];
      if (!it || Game.count(arg) < 1) acted = false;
      else if (it.hp || it.en) { Game.addItem(arg, -1); Game.heal(it.hp || 0, it.en || 0); C.say(it.e + ' Usas ' + it.n + '.', 'good'); G.Sfx.play('heal'); }
      else if (it.cure) { Game.addItem(arg, -1); c.pst = {}; C.say(it.e + ' Te curas de todos los estados.', 'good'); }
      else if (it.dmg) { Game.addItem(arg, -1); const t = C.target(); hitEnemy(t, it.dmg, ''); C.say(it.e + ' ' + it.n + ': ' + it.dmg + ' de daño a ' + t.n + '.'); G.Sfx.play('hit'); }
      else if (it.flee) { if (c.opts.noFlee) { C.say('🚫 No puedes huir de este combate.', 'bad'); acted = false; } else { Game.addItem(arg, -1); C.say('💨 Lanzas la bomba de humo y escapas.'); c.done = 'flee'; return c; } }
      else acted = false;
    } else if (kind === 'flee') {
      if (c.opts.noFlee) { C.say('🚫 No puedes huir de este combate.', 'bad'); acted = false; }
      else {
        const avg = U.sum(C.alive().map((e) => e.spd)) / Math.max(1, C.alive().length);
        const p = U.clamp(0.45 + (d.spd - avg) * 0.04, 0.2, 0.9);
        if (rnd() < p) { C.say('🏃 ¡Logras escapar!'); c.done = 'flee'; return c; }
        C.say('🏃 No consigues escapar.', 'bad');
      }
    }

        const p = U.clamp(0.5 + (n.romance - 70) / 100 + (n.affinity - 65) / 200 + (MOOD_MOD[n.mood] || 0), 0.2, 0.95);
        if (rnd() < p) {
          Game.addItem('anillo', -1); n.status = 'married'; P.spouse = n.id; n.romance = 100; n.mood = 'enamorado';
          Object.values(s.npcs).forEach((x) => { if (x.id !== n.id && x.status === 'dating') { x.status = 'ex'; x.mood = 'triste'; x.affinity -= 20; } });
          if (s.family.home) { n.home = s.family.home; const hp = W.poi(s, s.family.home); if (!hp.npcs.includes(n.id)) hp.npcs.push(n.id); }
          lines.push(line(n, pick(T.proponer.yes), 'enamorado')); eff.push('💍 ¡Os habéis casado!'); G.Sfx.play('level'); Game.log('💍 Te has casado con ' + NPC.fullName(n) + '.', 'love'); Game.addHonor(3);
        } else { n.mood = 'nervioso'; n.romance -= 4; lines.push(line(n, pick(T.proponer.no), 'nervioso')); eff.push('Romance -4'); }
        return r;
      }
      case 'terminar': {
        n.status = 'ex'; n.romance = 0; n.affinity -= 25; n.mood = 'triste'; lines.push({ who: 'me', text: 'Creo que lo mejor es que lo dejemos...' }); lines.push(line(n, pick(T.terminar), 'triste')); eff.push('💔 Habéis roto'); Game.advance(1); Game.log('Rompes con ' + n.name + '.', 'bad'); return r;
      }
      case 'ayuda': {
        const act = s.quests.find((q) => q.giver === n.id && q.status !== 'done');
        if (act) { if (Game.questReady(act)) { return So.interact(nid, 'entregar'); } lines.push(line(n, 'Ya te he pedido algo: ' + act.desc, 'serio')); return r; }
        if (rnd() < 0.3 && !n.special) { lines.push(line(n, pick(T.ayuda.none), 'sereno')); setDone(n, 'ayuda'); return r; }
        const q = Game.makeQuest(U.R, G.S.world.pois.find((p) => p.id === n.home)?.tier || 1, n.id);
        q.reward = Object.assign({}, q.reward, { gold: Math.round(q.reward.gold * 0.8) });
        s.quests.push(q); setDone(n, 'ayuda'); Game.advance(1);
        lines.push(line(n, pick(T.ayuda.give) + ' ' + q.desc, 'serio')); eff.push('📜 Nueva misión: ' + q.title); Game.log('Misión de ' + n.name + ': ' + q.title, 'quest'); return r;
      }
      case 'entregar': {
        const q = s.quests.find((x) => x.giver === n.id && Game.questReady(x)); if (!q) { lines.push({ who: 'sys', text: 'No tienes nada que entregar.' }); return r; }
        const out = Game.turnIn(q); lines.push(line(n, pick(T.ayuda.done), 'alegre')); eff.push(...out); G.Sfx.play('win'); return r;
      }
      case 'entrenar': {
        const p = chance(n, 'entrenar'); setDone(n, 'entrenar');
        if (rnd() > p) { lines.push(line(n, pick(T.entrenar.bad), 'serio')); Game.advance(1); return r; }
        Game.advance(6); lines.push(line(n, pick(T.entrenar.good), 'alegre')); eff.push(...Game.gainXp(14 + P.level * 3)); change(n, 3, 0, 'alegre', eff);
        if (rnd() < 0.2) { const k = pick(Object.keys(D.STATS)); P.stats[k]++; eff.push('📈 ' + D.STATS[k].n + ' +1'); } return r;
      }
      case 'retar': {
        lines.push({ who: 'me', text: '¿Qué tal un combate amistoso, ' + n.name + '?' });
        const p = U.clamp(0.5 + (D.PERS[n.pers].mod.retar || 0) + n.affinity / 300, 0.15, 0.95);
        if (n.age > 62 && !n.power) { lines.push(line(n, 'Jajaja, a mi edad... mejor no.', 'alegre')); return r; }
        if (rnd() > p) { lines.push(line(n, 'No me apetece pelear ahora.', 'serio')); return r; }
        lines.push(line(n, '¡Acepto! No me contengas.', 'burlon'));
        r.fight = [{ id: n.special === 'rival' ? 'ronin' : 'bandido', lvl: Math.max(1, n.level + (n.special === 'rival' ? 2 : 0)), extra: { n: n.name, e: n.special === 'rival' ? '🥋' : '🥊', human: true, gold: 0, drops: [], xp: 22 + n.level * 10, duel: n.id } }];
        Game.advance(2); return r;
      }
    }
    return r;
  };
  So.duelResult = function (n, win) {
    const eff = []; const lines = [];
    if (win) { change(n, 6, 0, moodAfter(n, true), eff); lines.push(line(n, pick(D.ACT.retar.win), n.mood)); if (n.special === 'rival') { G.S.player.fame += 3; eff.push('📣 Fama +3'); } }
    else { change(n, 3, 0, 'burlon', eff); lines.push(line(n, pick(D.ACT.retar.lose), 'burlon')); }
    return { lines, eff };
  };

  /* ---- Rumores ---- */
  So.rumor = function (n) {
    const s = G.S, R = U.R; const k = R.r();
    if (k < 0.4) { const p = Game.revealRandomPoi(); if (p) return 'Dicen que por esta zona está ' + p.name + '. Yo no iría solo... pero te lo marco en el mapa. 🗺️'; }
    if (k < 0.75) {
      const pool = Object.values(s.npcs).filter((x) => x.id !== n.id && x.met);
      if (pool.length >= 2) { const a = R.pick(pool), b = R.pick(pool.filter((x) => x.id !== a.id)); return R.pick(['He oído que ' + a.name + ' y ' + b.name + ' se llevan muy bien últimamente...', 'Dicen que ' + a.name + ' anda preguntando por ' + b.name + '. Qué cosas.', a.name + ' se quejaba de ' + b.name + ' el otro día. Algo pasó.']); }
    }
    const e = R.pick(Object.values(D.ENEMIES).filter((x) => !x.boss));
    return 'Cuidado en los caminos: se han visto ' + e.n.toLowerCase() + ' por los alrededores. ' + (R.chance(0.5) ? 'Dicen que sueltan buen botín.' : 'Llevan semanas dando problemas.');
  };

  /* ---- Familia ---- */
  function mkChild(g, ageYears, parentA, parentB) {
    const s = G.S, P = s.player, R = U.R;
    const names = g === 'm' ? D.CHILD_NAMES_M : D.CHILD_NAMES_F;
    const a = parentA.look, b = (parentB && parentB.look) || a;
    const mixp = (k) => (R.chance(0.5) ? a[k] : b[k]);
    const look = { skin: mixp('skin'), hairColor: mixp('hairColor'), hairName: mixp('hairName'), hairStyle: g === 'f' ? R.pick(['bob', 'twin', 'long', 'ponytail']) : R.pick(['short', 'spiky']), grey: 0, eye: mixp('eye'), eyeName: mixp('eyeName'), outfit: R.pick(D.OUTFITS), outfit2: '#f4d8a0', accs: [], age: ageYears, gender: g, build: 'atletico', buildTags: ['atletico'], height: 'medio', eyeShape: 'big' };
    return { id: U.uid('c'), name: R.pick(names), gender: g, birthDay: s.time.day - ageYears * D.DAYS_YEAR, look, bond: 30, skill: 0, trait: R.pick(D.CHILD_TRAITS), power: R.chance(0.6) ? (R.chance(0.5) ? P.power : (parentB && parentB.power) || P.power) : null, other: parentB ? parentB.id : null };
  }
  So.childAge = (c) => Game.childAge(c);
  So.childTrait = (c) => c.trait.replace('{x}', NPC.ox(c.gender));
  So.tryChild = function (n) {
    const s = G.S, P = s.player;
    if (!s.family.home) return { ok: false, msg: 'Necesitáis un hogar para formar una familia.' };
    if (s.family.pending) return { ok: false, msg: 'Ya hay un bebé en camino.' };
    if (n.gender === P.gender) return { ok: false, msg: 'Podéis adoptar a un niño o niña que necesite un hogar.' };
    Game.advance(2); n.romance = Math.min(100, n.romance + 3);
    if (rnd() < 0.45) { s.family.pending = { day: s.time.day + 12, partner: n.id }; Game.log('👶 ¡' + n.name + ' y tú vais a tener un bebé!', 'love'); return { ok: true, msg: '👶 ¡Esperáis un bebé! Nacerá en unos 12 días.' }; }
    return { ok: true, msg: 'Pasáis una noche preciosa, pero aún no hay noticias. Podéis seguir intentándolo.' };
  };
  So.adopt = function () {
    const s = G.S, P = s.player; const cost = 100;
    if (!s.family.home) return { ok: false, msg: 'Primero necesitas un hogar.' };
    if (s.family.children.length >= 5) return { ok: false, msg: 'Tu casa ya está llena de niños.' };
    if (P.gold < cost) return { ok: false, msg: 'Los trámites cuestan ' + cost + ' ryo.' };
    P.gold -= cost; const sp = P.spouse && s.npcs[P.spouse]; const c = mkChild(U.R.pick(['m', 'f']), U.R.ri(3, 7), P, sp || null); c.adopted = true; s.family.children.push(c); Game.addHonor(3);
    Game.log('🧒 Adoptas a ' + c.name + '.', 'love'); return { ok: true, msg: '🧒 ¡' + c.name + ' ya es parte de tu familia!' };
  };
  So.onDay = function () {
    const s = G.S, out = [], pend = s.family.pending;
    if (pend && s.time.day >= pend.day) {
      const sp = s.npcs[pend.partner]; const c = mkChild(U.R.pick(['m', 'f']), 0, G.S.player, sp); s.family.children.push(c); s.family.pending = null;
      out.push('👶 ¡Ha nacido ' + c.name + '! ' + (c.gender === 'm' ? 'Es un niño sano.' : 'Es una niña sana.'));
    }
    s.family.children.forEach((c) => { const a = Game.childAge(c); if (a === 10 && !c.asp) { c.asp = U.R.pick(['aventurero', 'curandero', 'herrero', 'guardián', 'erudito', 'artista']); out.push('🧒 ' + c.name + ' dice que de mayor quiere ser ' + c.asp + '.'); } });
    return out;
  };
  So.childAct = function (cid, kind) {
    const s = G.S, c = s.family.children.find((x) => x.id === cid); const P = s.player; const eff = [];
    if (!c) return null; const age = Game.childAge(c);
    c.acts = c.acts || {}; if (c.acts.day !== s.time.day) c.acts = { day: s.time.day, n: 0 };
    if (c.acts.n >= 3) return { text: c.name + ' está cansad' + NPC.ox(c.gender) + ' por hoy. Mañana seguiréis.', eff };
    c.acts.n++; Game.advance(3);
    if (kind === 'jugar') { c.bond = Math.min(100, c.bond + 4); eff.push('💞 Vínculo +4'); return { text: pick(['Jugáis a las sombras chinescas hasta que se ríe a carcajadas.', 'Corréis por el jardín; ' + c.name + ' te gana por un pelo (o te dejas).', 'Construís un fuerte de cojines. Es el mejor fuerte del mundo.']), eff }; }
    if (kind === 'ensenar') {
      if (age < 5) return { text: c.name + ' es muy pequeñ' + NPC.ox(c.gender) + ' para aprender eso.', eff }; c.skill = Math.min(20, c.skill + 1); c.bond = Math.min(100, c.bond + 2); eff.push('📘 Aprendizaje +1', '💞 Vínculo +2');
      if (!c.power && c.skill >= 6) { c.power = P.power; eff.push('🔮 ¡Despierta el poder de ' + D.POWERS[P.power].n + '!'); }
      return { text: 'Le enseñas ' + pick(['a respirar y concentrar su ki', 'una postura básica de combate', 'a leer las estrellas', 'a cocinar un buen caldo']) + '. Presta mucha atención.', eff };
    }
    if (kind === 'regalo') { if (Game.count('peluche') > 0) { Game.addItem('peluche', -1); c.bond = Math.min(100, c.bond + 10); eff.push('💞 Vínculo +10'); return { text: c.name + ' abraza el peluche y no te suelta en toda la tarde.', eff }; } if (Game.count('dango') > 0) { Game.addItem('dango', -1); c.bond = Math.min(100, c.bond + 5); eff.push('💞 Vínculo +5'); return { text: 'Se come el dango con los ojos brillantes.', eff }; } c.acts.n--; return { text: 'No tienes un peluche o dango que regalarle.', eff }; }
    return null;
  };
})((window.G = window.G || {}));

<script>

    if (st === 0) {
      body = '<h3>¿Quién eres?</h3><label>Tu nombre<input type="text" maxlength="18" data-bind="name" value="' + esc(c.name) + '" placeholder="Ej.: Akira, Sakura…" autocomplete="off"></label>'
        + '<div class="row"><div><span class="lbl">Género</span><div class="chips">' + chip('♂ Hombre', c.gender === 'm', 'cc_gender', 'm') + chip('♀ Mujer', c.gender === 'f', 'cc_gender', 'f') + '</div></div>'

    } else if (st === 1) {
      body = '<h3>Descríbete</h3><p class="hint">Escribe cómo eres con tus palabras. Los habitantes del mundo recordarán detalles de lo que escribas y yo intentaré adaptar tu aspecto (pelo, ojos, complexión…).</p>'
        + '<label>Tu aspecto físico<textarea rows="3" data-bind="self.look" placeholder="Ej.: Soy alta, de pelo rojo largo y ojos verdes, con pecas y cuerpo atlético…">' + esc(c.self.look) + '</textarea></label>'

    } else if (st === 2) {

      body = '<h3>Tu aspecto</h3><span class="lbl">Peinado</span><div class="chips">' + Object.keys(D.HAIR_STYLES).filter((k) => !(c.gender === 'm' && ['twin', 'bun'].includes(k))).map((k) => chip(D.HAIR_STYLES[k], c.look.hairStyle === k, 'cc_pick', 'hairStyle', k)).join('') + '</div>'
        + '<span class="lbl">Color de pelo</span>' + sw(D.HAIR_COLORS, c.look.hairColor, 'cc_hair', (x) => x.hex)

  const TABS = [['char', '🧑 Personaje'], ['inv', '🎒 Mochila'], ['quests', '📜 Misiones'], ['rel', '💞 Gente'], ['family', '🏠 Familia'], ['map', '🗺️ Mapa'], ['diary', '📖 Diario'], ['sys', '⚙️ Sistema']];

        + '<h4>Combate</h4><p class="muted">Vida ' + d.maxHp + ' · Energía ' + d.maxEn + ' · Ataque ' + d.atk.toFixed(0) + ' · Poder ' + d.mag.toFixed(0) + ' · Defensa ' + d.def.toFixed(0) + ' · Crítico ' + d.crit.toFixed(0) + '% · Esquiva ' + d.dodge.toFixed(0) + '%</p>'
        + '<h4>Equipo</h4><div class="equip">' + ['arma', 'armadura', 'amuleto'].map((sl) => { const it = D.ITEMS[P.equip[sl]]; return '<button class="slot" data-act="unequip" data-a="' + sl + '"' + (it ? '' : ' disabled') + '><small>' + sl + '</small>' + (it ? it.e + ' ' + it.n : '—') + '</button>'; }).join('') + '</div>'
        + '<h4>Técnicas de ' + pw.n + '</h4>' + pw.skills.map((sk) => '<div class="skill ' + (sk.lvl > P.level ? 'lock' : '') + '"><b>' + (sk.lvl > P.level ? '🔒' : pw.e) + ' ' + sk.n + '</b><small>Nv. ' + sk.lvl + ' · ' + sk.cost + ' energía · ' + UI.skillDesc(sk) + '</small></div>').join('') + '</div></div>';
    } else if (tab === 'inv') {
      const groups = [['cons', 'Consumibles'], ['weapon', 'Armas'], ['armor', 'Armaduras'], ['amulet', 'Amuletos'], ['gift', 'Regalos'], ['mat', 'Materiales'], ['key', 'Especiales']];
      h = '<p class="muted">🪙 ' + P.gold + ' ryo</p>' + groups.map(([t, l]) => { const items = Object.keys(P.inv).filter((id) => D.ITEMS[id] && D.ITEMS[id].t === t); if (!items.length) return ''; return '<h4>' + l + '</h4>' + items.map((id) => { const it = D.ITEMS[id], eq = Object.values(P.equip).includes(id); return '<div class="item"><span>' + it.e + ' <b>' + it.n + '</b> ×' + P.inv[id] + (eq ? ' <em>(equipado)</em>' : '') + '<small>' + it.d + '</small></span><span>' + (it.t === 'cons' && (it.hp || it.en || it.cure) ? UI.btn('Usar', 'useitem', id, null, { cls: 'mini' }) : '') + (['weapon', 'armor', 'amulet'].includes(it.t) && !eq ? UI.btn('Equipar', 'equip', id, null, { cls: 'mini' }) : '') + '</span></div>'; }).join(''); }).join('') || '<p class="muted">Tu mochila está vacía.</p>';

      h = '<h4>Historia principal</h4>' + main.map(row).join('') + '<h4>Encargos</h4>' + (side.length ? side.map(row).join('') : '<p class="muted">No tienes encargos. Prueba en el gremio de una ciudad, o pide ayuda a alguien con quien tengas confianza.</p>') + '<p class="hint">Sellos: ' + s.main.seals + '/3</p>';
    } else if (tab === 'rel') {
      const met = Object.values(s.npcs).filter((n) => n.met && n.status !== 'dead').sort((a, b) => NPC.stageOf(b).h - NPC.stageOf(a).h || b.affinity - a.affinity);
      h = met.length ? '<div class="relgrid">' + met.map((n) => { const st = NPC.stageOf(n), poi = n.home && W.poi(s, n.home); return '<div class="relcard">' + G.Port.html(n, n.mood, { w: 64 }) + '<div><b>' + esc(n.name) + '</b> <small>' + esc(NPC.jobName(n)) + '</small><div class="hearts">' + '♥'.repeat(st.h) + '<span>' + '♡'.repeat(5 - st.h) + '</span></div><small>' + st.n + ' · afinidad ' + n.affinity + (NPC.canRomance(n, P) ? ' · romance ' + n.romance : '') + '</small><small>📍 ' + (poi ? esc(poi.name) : 'de viaje') + '</small></div></div>'; }).join('') + '</div>' : '<p class="muted">Todavía no conoces a nadie. ¡Habla con la gente de los pueblos!</p>';
    } else if (tab === 'family') {
      h = UI.familyHtml();
    } else if (tab === 'map') {
      h = '<canvas id="bigmap" class="bigmap"></canvas><p class="hint">🟡 Asentamientos · el círculo blanco eres tú. Haz clic en el mapa principal para caminar.</p>';
    } else if (tab === 'diary') {
      h = '<div class="diary">' + s.log.slice().reverse().slice(0, 80).map((l) => '<p class="' + l.c + '"><small>Día ' + l.d + ' ' + D.PHASES[l.ph].e + '</small> ' + esc(l.t) + '</p>').join('') + '</div>';
    } else if (tab === 'sys') {
      h = '<h4>Guardar partida</h4><div class="chips">' + [1, 2, 3].map((i) => UI.btn('💾 Ranura ' + i, 'saveslot', 'slot' + i)).join('') + '</div><p class="hint">Se guarda automáticamente cada pocos pasos en este navegador (IndexedDB).</p><h4>Copia de seguridad</h4><div class="chips">' + UI.btn('⬇️ Exportar partida (.json)', 'export') + UI.btn('⬆️ Importar', 'import') + '</div><h4>Ajustes</h4><div class="chips">' + UI.btn(G.Settings.data.sound ? '🔊 Sonido: sí' : '🔇 Sonido: no', 'sound') + '</div><h4>Controles</h4><p class="muted">Flechas o WASD para moverte · clic en el mapa para caminar · C personaje · I mochila · M misiones · R gente · F familia · N mapa · J diario</p><h4>Salir</h4>' + UI.btn('🏠 Volver al título', 'totitle', null, null, { cls: 'ghost' });
    }
    body.innerHTML = h;
    if (tab === 'map') UI.drawMini($('bigmap'));
  };
  UI.skillDesc = function (sk) {
    let t = sk.t === 'heal' ? 'Cura' : sk.t === 'buff' ? D.STATUS[sk.buff.id].n + ' ' + sk.buff.t + ' turnos' : sk.t === 'drain' ? 'Daño ×' + sk.m + ' y absorbe vida' : 'Daño ×' + sk.m + (sk.aoe ? ' a todos' : '');
    if (sk.st) t += ' · ' + Math.round(sk.st.p * 100) + '% ' + D.STATUS[sk.st.id].n.toLowerCase();
    return t;
  };
  A.spend = (k) => { if (Game.spendPoint(k)) { G.Sfx.play('level'); UI.hud(); UI.renderTab('char'); } };
  A.unequip = (sl) => { Game.unequip(sl); UI.renderTab('char'); };
  A.useitem = (id) => { const r = Game.useItem(id); if (r) UI.toast(r.msg); UI.hud(); UI.renderTab('inv'); };
  A.equip = (id) => { Game.equip(id); UI.renderTab('inv'); };
  A.saveslot = async (sl) => { await Game.save(sl); UI.toast('💾 Partida guardada.'); };
  A.export = () => { G.Storage.exportFile(Object.assign({}, G.S, { combat: null, savedAt: Date.now() })); };
  A.totitle = async () => { await Game.save('auto'); $('modal').classList.add('hidden'); UI.showTitle(); };
})((window.G = window.G || {}));

<script>
/* KAZEHANA · interfaz (vistas del panel): exploración, asentamientos, diálogo, combate, eventos, mazmorras, familia */
(function (G) {
  'use strict';
  const D = G.D, U = G.U, W = G.World, NPC = G.NPC, Game = G.Game, So = G.Social, C = G.Combat, UI = G.UI, esc = U.esc, A = UI.acts, $ = UI.$;
  const S = () => G.S;

  /* ================= EXPLORACIÓN ================= */
  UI.viewIntro = function () {
    const P = S().player, o = D.ORIGINS[P.origin];

    UI.panel('Tu historia comienza', '<p class="story">' + esc(o.intro) + '</p>' + (P.self.story ? '<p class="quote">«' + esc(P.self.story.slice(0, 300)) + '»</p>' : '')
      + '<p class="hint">Explora el mapa con las <b>flechas / WASD</b> o haciendo clic. Entra en los pueblos para conocer gente, comprar, entrenar y formar una familia. Habla con el maestro de tu pueblo para empezar la historia principal.</p>' + UI.btn('⛩️ Empezar', 'intro_go', null, null, { cls: 'primary big' }), 'story');
  };
  A.intro_go = () => { const s = S(), poi = W.poiAt(s, s.player.x, s.player.y); poi ? UI.viewPoi(poi) : UI.viewExplore(); };

  UI.viewExplore = function () {
    const s = S(), P = s.player; UI.view = 'explore'; UI.hud(); UI.draw();
    const t = W.tileAt(s, P.x, P.y), tier = Game.regionTier(P.x, P.y);
    const near = s.world.pois.filter((p) => s.explored[p.y * s.world.w + p.x] && !(p.hidden && !p.revealed) && W.dist(p, P) <= 14).sort((a, b) => W.dist(a, P) - W.dist(b, P)).slice(0, 5);
    const dirTxt = (p) => (p.y < P.y ? 'N' : p.y > P.y ? 'S' : '') + (p.x < P.x ? 'O' : p.x > P.x ? 'E' : '');
    const logs = s.log.slice(-4).reverse();
    UI.panel('Explorando', '<div class="tileinfo"><b>' + W.ZONE_NAMES[t] + '</b> · peligro ' + '☠️'.repeat(tier) + '<small>' + D.PHASES[s.time.phase].n + ' · ' + D.SEASONS[Game.season()] + '</small></div>'
      + (near.length ? '<h4>Cerca de ti</h4><ul class="near">' + near.map((p) => '<li>' + D.POI_KINDS[p.type].e + ' ' + esc(p.name) + ' <small>' + W.dist(p, P) + ' pasos al ' + dirTxt(p) + '</small></li>').join('') + '</ul>' : '<p class="muted">No hay lugares conocidos cerca. ¡Explora!</p>')
      + '<div class="chips">' + UI.btn('⛺ Acampar', 'camp') + UI.btn('⏳ Esperar', 'wait') + UI.btn('🧪 Mochila', 'tab', 'inv') + '</div>'
      + '<h4>Últimos sucesos</h4><div class="mini-log">' + logs.map((l) => '<p class="' + l.c + '">' + esc(l.t) + '</p>').join('') + '</div>', 'explore');
  };
  UI.updateTile = function () { if (UI.view === 'explore') UI.viewExplore(); };
  A.wait = () => { const o = Game.advance(D.STEPS_PHASE); UI.toasts(o); UI.hud(); UI.draw(); UI.viewExplore(); };
  A.camp = () => {
    const r = Game.rest('camp'); UI.hud(); UI.draw(); UI.autosave();
    if (r.ambush) { UI.panel('Acampada', '<p>' + r.msg + '</p><p class="bad">¡Algo te ha despertado en mitad de la noche!</p>', 'event'); setTimeout(() => UI.fight(Game.makeGroup(Game.zoneOf(S().player.x, S().player.y), Game.regionTier(S().player.x, S().player.y)), {}, () => UI.viewExplore()), 900); }
    else UI.panel('Acampada', '<p>' + r.msg + '</p>' + UI.btn('Continuar', 'explore', null, null, { cls: 'primary' }), 'event');
  };
  A.explore = () => UI.viewExplore();

  UI.handleEncounter = function (enc) {
    if (enc.type === 'combat') UI.fight(enc.group, {}, () => UI.viewExplore());
    else if (enc.type === 'event') UI.viewEvent(enc.ev, () => UI.viewExplore());
    else if (enc.type === 'traveler') { const n = Game.meetTraveler(); UI.panel('Un viajero', '<p>Te cruzas en el camino con ' + NPC.shortDesc(n) + '.</p>' + UI.btn('Acercarte', 'npc', n.id, 'explore', { cls: 'primary' }) + UI.btn('Ignorar', 'explore'), 'event'); }
    else if (enc.type === 'treasure') {
      const msgs = []; S().player.gold += enc.gold; msgs.push('🪙 +' + enc.gold + ' ryo'); if (enc.item) { Game.addItem(enc.item, 1); msgs.push(D.ITEMS[enc.item].e + ' ' + D.ITEMS[enc.item].n); }
      G.Sfx.play('coin'); UI.hud(); UI.panel('¡Hallazgo!', '<p>Entre unas rocas encuentras un pequeño botín olvidado.</p>' + UI.list(msgs) + UI.btn('Continuar', 'explore', null, null, { cls: 'primary' }), 'event');
    }
  };

  /* ================= LUGARES ================= */
  UI.viewPoi = function (poi) {
    UI.view = 'poi'; UI.hud(); UI.draw(); const s = S(), P = s.player;
    if (poi.settle) {
      const conf = D.SETTLE[poi.type], here = P.home === poi.id;
      UI.panel(conf.e + ' ' + esc(poi.name), '<p class="muted">' + conf.n + ' · ' + poi.npcs.length + ' habitantes' + (s.family.home === poi.id ? ' · 🏠 tu hogar' : '') + '</p>'
        + '<p>' + ({ aldea: 'Casas de madera, campos de arroz y humo de cocinas.', ciudad: 'Calles animadas, faroles de papel y puestos de todo tipo.', capital: 'Murallas altas, tejados dorados y gente de todas partes.', monte: 'Cabañas de piedra entre la niebla, con olor a pino y leña.' }[poi.type]) + '</p>'
        + UI.btn('🚪 Entrar', 'town', poi.id, null, { cls: 'primary big' }) + UI.btn('Seguir camino', 'explore'), 'town');
      return;
    }
    const cd = Game.dungeonCooldown(poi), k = poi.type;
    const txt = { santuario: 'Un santuario antiguo, impregnado de energía. Aquí se guarda uno de los Sellos Ancestrales.', guarida: 'Una fortaleza de piedra negra bajo un cielo sin estrellas. Aquí duerme el Señor de las Sombras.', cueva: 'La entrada de una cueva exhala aire frío.', ruinas: 'Columnas rotas y estatuas sin rostro.', torre: 'Una torre inclinada, con ventanas como ojos vacíos.', mina: 'Vagonetas oxidadas y túneles que se pierden en la oscuridad.', bosque: 'Miles de farolillos flotan entre los árboles. No parecen encendidos por manos humanas.' }[k];
    UI.panel(D.POI_KINDS[k].e + ' ' + esc(poi.name), '<p>' + txt + '</p><p class="muted">Nivel de peligro ' + '☠️'.repeat(poi.tier) + (poi.sealTaken ? ' · 🔰 sello recogido' : '') + '</p>'
      + (cd > 0 ? '<p class="hint">El lugar está tranquilo. Podrás volver en ' + cd + ' días.</p>' : UI.btn('⚔️ Adentrarte', 'dg_enter', poi.id, null, { cls: 'primary big' })) + UI.btn('Retirarte', 'explore'), 'dungeon');
  };

  A.town = (id) => UI.viewTown(W.poi(S(), id));
  UI.viewTown = function (poi) {
    UI.view = 'town'; UI.hud(); const s = S(), conf = D.SETTLE[poi.type];
    const places = conf.places.map((pl) => { const n = W.npcsAt(s, poi, pl).length; return '<button class="place" data-act="place" data-a="' + poi.id + '" data-b="' + pl + '"><span>' + D.PLACES[pl].e + '</span><b>' + D.PLACES[pl].n + '</b><small>' + n + ' ' + (n === 1 ? 'persona' : 'personas') + '</small></button>'; }).join('');
    const home = s.family.home === poi.id;
    UI.panel(conf.e + ' ' + esc(poi.name), '<p class="muted">' + D.PHASES[s.time.phase].e + ' ' + D.PHASES[s.time.phase].n + ' · Día ' + s.time.day + '</p><div class="places">' + places + '</div>'
      + '<div class="chips">' + UI.btn('🛏️ Posada (' + conf.inn + ' ryo)', 'inn', poi.id) + UI.btn('🚶 Pasear', 'stroll', poi.id)
      + (home ? UI.btn('🏠 Mi casa', 'home', poi.id, null, { cls: 'primary' }) : (!s.family.home ? UI.btn('🏷️ Comprar casa (' + conf.house + ' ryo)', 'buyhouse', poi.id) : '')) + UI.btn('🚪 Salir', 'explore', null, null, { cls: 'ghost' }) + '</div>', 'town');
  };
  A.inn = (id) => { const poi = W.poi(S(), id); const r = Game.rest('inn', poi); UI.hud(); UI.draw(); if (r.ok) UI.autosave(); UI.panel('Posada', '<p>' + r.msg + '</p>' + UI.btn('Continuar', 'town', id, null, { cls: 'primary' }), 'town'); };
  A.buyhouse = (id) => { const poi = W.poi(S(), id); const r = Game.buyHouse(poi); UI.hud(); UI.toast(r.msg); G.Sfx.play(r.ok ? 'level' : 'bad'); UI.viewTown(poi); };

  A.place = (id, pl) => UI.viewPlace(W.poi(S(), id), pl);
  function npcCard(n, back) {
    const st = NPC.stageOf(n), P = S().player;
    return '<button class="npccard" data-act="npc" data-a="' + n.id + '" data-b="' + back + '">' + G.Port.html(n, n.mood, { w: 56 }) + '<span><b>' + UI.pName(n) + '</b><small>' + (n.met ? esc(U.cap(NPC.jobName(n))) + ' · ' : '') + D.MOODS[n.mood].e + ' ' + D.MOODS[n.mood].l + '</small><i class="hearts">' + '♥'.repeat(st.h) + '</i>' + (NPC.canRomance(n, P) && NPC.attraction(n, P) >= 70 ? ' <i title="Te atrae">🔥</i>' : '') + '</span></button>';
  }
  UI.viewPlace = function (poi, pl) {
    UI.view = 'place'; UI.hud(); const s = S(), P = s.player; UI.cur = { poi: poi.id, place: pl };
    const people = W.npcsAt(s, poi, pl);
    let svc = '';
    if (pl === 'mercado') svc = UI.btn('🛒 Tienda', 'shop', poi.id, 'buy');
    if (pl === 'gremio') svc = UI.btn('📜 Tablón de encargos', 'board', poi.id);
    if (pl === 'dojo') svc = UI.btn('🥋 Entrenar', 'train', poi.id);
    if (pl === 'templo') svc = UI.btn('🙏 Rezar', 'pray', poi.id) + UI.btn('🔮 Maestro de poderes', 'rank', poi.id);
    if (pl === 'arena') svc = UI.btn('⚔️ Combates de arena', 'arena', poi.id);
    if (pl === 'taberna') svc = UI.btn('🍶 Pedir una bebida (8 ryo)', 'drink', poi.id) + UI.btn('👀 Buscar compañía', 'stroll', poi.id);
    if (pl === 'plaza') svc = UI.btn('🚶 Pasear por las calles', 'stroll', poi.id);
    UI.panel(D.PLACES[pl].e + ' ' + D.PLACES[pl].n + ' · ' + esc(poi.name), '<p class="muted">' + D.PLACES[pl].d + '</p><div class="chips">' + svc + '</div><h4>Gente aquí ahora</h4>' + (people.length ? '<div class="npclist">' + people.map((n) => npcCard(n, 'place')).join('') + '</div>' : '<p class="muted">No hay nadie a esta hora.</p>') + '<div class="chips">' + UI.btn('← Volver', 'town', poi.id, null, { cls: 'ghost' }) + '</div>', 'town');
  };
  A.pray = (id) => { const s = S(), P = s.player, poi = W.poi(s, id); const d = Game.derived(P); const f = s.flags.prayDay === s.time.day; Game.advance(2); if (!f) { s.flags.prayDay = s.time.day; Game.heal(Math.round(d.maxHp * 0.3), Math.round(d.maxEn * 0.5)); Game.addHonor(1); UI.toast('🙏 Sientes paz. Recuperas fuerzas.'); } else UI.toast('Hoy ya has rezado. La calma sigue contigo.'); UI.hud(); UI.viewPlace(poi, 'templo'); };
  A.drink = (id) => { const s = S(), P = s.player, poi = W.poi(s, id); if (P.gold < 8) { UI.toast('Necesitas 8 ryo.'); return; } P.gold -= 8; Game.advance(2); Game.heal(10, 5); const rumor = So.rumor({}); UI.hud(); UI.panel('🍶 Taberna', '<p>Pides una bebida. El tabernero se inclina y susurra:</p><p class="quote">«' + esc(rumor) + '»</p>' + UI.btn('← Volver', 'place', id, 'taberna', { cls: 'primary' }), 'town'); };
  A.stroll = (id) => {
    const s = S(), P = s.player, poi = W.poi(s, id), R = U.R; Game.advance(3); UI.hud();

    else if (UI.csub === 'items') { const its = Object.keys(P.inv).filter((id) => D.ITEMS[id].t === 'cons'); menu = '<div class="chips">' + (its.length ? its.map((id) => UI.btn(D.ITEMS[id].e + ' ' + D.ITEMS[id].n + ' ×' + P.inv[id], 'cb', 'item', id, { title: D.ITEMS[id].d })).join('') : '<span class="muted">Sin objetos.</span>') + '</div>' + UI.btn('← Atrás', 'cb_sub', '', null, { cls: 'ghost' }); }
    else menu = '<div class="chips big">' + UI.btn('🗡️ Atacar', 'cb', 'attack', null, { cls: 'primary' }) + UI.btn('✨ Técnicas', 'cb_sub', 'skills') + UI.btn('🛡️ Defender', 'cb', 'defend') + UI.btn('🎒 Objetos', 'cb_sub', 'items') + UI.btn('🏃 Huir', 'cb', 'flee', null, { off: !!c.opts.noFlee }) + '</div>';
    UI.panel('⚔️ Combate · turno ' + c.turn, '<div class="enemies">' + enemies + '</div><div class="pcard"><b>' + esc(P.name) + '</b> ' + stH(c.pst) + '<div class="bars2">' + UI.bar(P.hp, d.maxHp, 'hp') + UI.bar(P.en, d.maxEn, 'en') + '</div>' + fxOf('p') + '</div><div class="clog">' + c.log.slice(-7).map((l) => '<p class="' + l.c + '">' + esc(l.t) + '</p>').join('') + '</div>' + menu, 'combat');
    const cl = document.querySelector('.clog'); if (cl) cl.scrollTop = cl.scrollHeight;
    if (c.done) UI.endCombat();
  };
  A.cb_target = (i) => { C.setTarget(+i); UI.viewCombat(); };
  A.cb_sub = (k) => { UI.csub = k || null; UI.viewCombat(); };
  A.cb = (kind, arg) => { UI.csub = null; C.playerAct(kind, arg || undefined); UI.viewCombat(); };

  UI.endCombat = function () {
    const s = S(), c = s.combat, P = s.player, panel = $('panel');
    const wrap = (title, body, btn) => { const d = document.createElement('div'); d.className = 'cend'; d.innerHTML = '<h3>' + title + '</h3>' + body + btn; panel.querySelector('.panel-body').appendChild(d); };
    const finish = (res) => { s.combat = null; const f = UI.fightEnd; UI.fightEnd = null; UI.hud(); UI.draw(); UI.autosave(); if (f) f(res); else UI.viewExplore(); };
    A.cb_finish = () => finish(UI.lastRes);
    if (c.done === 'flee') { UI.lastRes = 'flee'; wrap('🏃 Has escapado', '', UI.btn('Continuar', 'cb_finish', null, null, { cls: 'primary' })); return; }
    if (c.done === 'win') {
      UI.lastRes = 'win'; G.Sfx.play('win');
      const allHuman = c.enemies.every((e) => e.human) && !c.opts.duel && !c.opts.arena && !c.enemies.some((e) => e.boss);
      const reward = (mode) => {
        const out = Game.victory(c);
        if (mode === 'spare') { Game.addHonor(4); out.push('🕊️ Honor +4 (perdonas la vida)'); if (U.R.chance(0.35)) { const p = Game.revealRandomPoi(); if (p) out.push('🗺️ Te susurran un secreto: ' + p.name); } }
        if (mode === 'kill') { Game.addHonor(-4); const g = Math.round(c.enemies.reduce((a, e) => a + e.gold, 0) * 0.3); S().player.gold += g; out.push('🩸 Honor -4 · botín extra +' + g + ' ryo'); }
        c.enemies.forEach((e) => { if (e.boss) out.push(...Game.onBoss(e.id)); });
        if (out.some((t) => t.includes('🎉'))) G.Sfx.play('level');
        UI.hud(); return out;
      };
      if (allHuman) {
        wrap('🏆 ¡Victoria!', '<p>Tus rivales están en el suelo, a tu merced…</p>', UI.btn('🕊️ Perdonarles', 'cb_mercy', 'spare', null) + UI.btn('🗡️ Acabar con ellos', 'cb_mercy', 'kill', null, { cls: 'danger' }));
        A.cb_mercy = (m) => { const out = reward(m); UI.panel('🏆 Victoria', UI.list(out) + UI.btn('Continuar', 'cb_finish', null, null, { cls: 'primary' }), 'combat'); };
      } else {
        const out = reward(null); wrap('🏆 ¡Victoria!', UI.list(out), UI.btn('Continuar', 'cb_finish', null, null, { cls: 'primary' }));
        if (s.main.done && c.enemies.some((e) => e.id === 'sombras')) { A.cb_finish = () => { s.combat = null; UI.fightEnd = null; s.dungeon = null; UI.viewEnding(); }; }
      }
      return;
    }
    if (c.done === 'lose') {
      G.Sfx.play('lose');
      if (c.opts.duel || c.opts.arena) { const d = Game.derived(P); P.hp = Math.max(1, Math.round(d.maxHp * 0.3)); UI.lastRes = 'lose'; wrap('💫 Has perdido el combate', '<p>Te levantas con orgullo herido pero sin daños graves.</p>', UI.btn('Continuar', 'cb_finish', null, null, { cls: 'primary' })); return; }
      const r = Game.defeat(); s.combat = null; UI.fightEnd = null; UI.hud(); UI.draw();
      if (r.over) { UI.gameOver(r.heirs); return; }
      UI.autosave();
      UI.panel('💀 Derrotado', '<p>' + esc(r.msg) + '</p>' + UI.btn('Continuar', 'poi_go', r.poi.id, null, { cls: 'primary' }), 'combat');
    }
  };
  A.poi_go = (id) => UI.viewPoi(W.poi(S(), id));

  UI.gameOver = function (heirs) {
    UI.view = 'over'; const P = S().player;
    UI.panel('💀 Has caído', '<p class="story">' + esc(P.name) + ' ha encontrado su final tras ' + S().time.day + ' días de aventura.</p>' + (heirs.length ? '<h4>Tu legado</h4><p class="muted">Uno de tus hijos puede continuar tu historia.</p>' + heirs.map((c) => '<div class="relcard">' + G.Port.html({ id: c.id, look: c.look }, 'alegre', { w: 64 }) + '<div><b>' + esc(c.name) + '</b> <small>' + Game.childAge(c) + ' años</small>' + UI.btn('Continuar como ' + esc(c.name), 'heir', c.id, null, { cls: 'primary mini' }) + '</div></div>').join('') : '<p class="muted">No tienes herederos. Tu historia termina aquí.</p>') + UI.btn('Volver al título', 'totitle', null, null, { cls: 'ghost' }), 'combat');
  };
  A.heir = (id) => { if (Game.continueAsHeir(id)) { G.Sfx.play('level'); UI.autosave(); UI.enterGame(); UI.toast('Una nueva generación comienza.'); } };

  UI.viewEnding = function () {
    const s = S(), P = s.player; UI.view = 'ending'; G.Sfx.play('level'); Game.save('auto');
    UI.panel('🌅 Epílogo', '<p class="story">El Señor de las Sombras se desvanece entre rayos de luz. Kazehana respira de nuevo, y por primera vez en siglos, el viento trae aroma a flores.</p><p>' + esc(P.name) + ', <b>' + D.honorTitle(P.honor) + '</b>, nivel ' + P.level + ' · ' + s.time.day + ' días · ' + P.kills + ' enemigos derrotados' + (P.spouse ? ' · casad' + (P.gender === 'm' ? 'o' : 'a') + ' con ' + esc(s.npcs[P.spouse].name) : '') + ' · ' + s.family.children.length + ' hijos.</p><p class="hint">Puedes seguir viviendo en este mundo: criar a tu familia, explorar, romancear y mejorar.</p>' + UI.btn('Seguir jugando', 'explore', null, null, { cls: 'primary' }) + UI.btn('Título', 'totitle', null, null, { cls: 'ghost' }), 'story');
  };

  /* ================= MAZMORRAS ================= */
  A.dg_enter = (id) => { const poi = W.poi(S(), id); Game.enterDungeon(poi); UI.viewDungeon(); };
  UI.viewDungeon = function () {
    const s = S(), dg = s.dungeon; if (!dg) { UI.viewExplore(); return; } const poi = W.poi(s, dg.poi); UI.view = 'dungeon'; UI.hud();
    const last = dg.room >= dg.rooms - 1;
    UI.panel(D.POI_KINDS[poi.type].e + ' ' + esc(poi.name), '<div class="dgbar">' + Array.from({ length: dg.rooms }, (_, i) => '<i class="' + (i < dg.room ? 'done' : i === dg.room ? 'cur' : '') + (i === dg.rooms - 1 ? ' boss' : '') + '"></i>').join('') + '</div><p class="story">' + (last ? 'Una presencia inmensa te espera tras la última puerta. Respira hondo.' : 'Sala ' + (dg.room + 1) + ' de ' + dg.rooms + '. La oscuridad te rodea; algo se mueve más allá.') + '</p>'
      + '<div class="chips">' + UI.btn(last ? '👁️ Enfrentarte al guardián' : '➡️ Avanzar', 'dg_next', null, null, { cls: 'primary big' }) + UI.btn('🎒 Mochila', 'tab', 'inv') + UI.btn('🚪 Retirarte', 'dg_leave', null, null, { cls: 'ghost' }) + '</div>', 'dungeon');
  };
  A.dg_leave = () => { const poi = W.poi(S(), S().dungeon.poi); S().dungeon = null; UI.viewPoi(poi); };
  UI.dgAfter = function (res) { const s = S(); if (!s.dungeon) return; if (res === 'win' || res === 'ok') s.dungeon.room++; UI.autosave(); UI.viewDungeon(); };
  A.dg_next = () => {
    const s = S(), P = s.player, poi = W.poi(s, s.dungeon.poi), room = Game.dungeonRoom(); UI.view = 'dungeon';
    if (room.type === 'combat') UI.fight(room.group, {}, (r) => UI.dgAfter(r));
    else if (room.type === 'boss') {
      UI.fight([{ id: room.enemy, lvl: Math.max(1, P.level + (poi.type === 'guarida' ? 2 : 1)) }], { noFlee: true }, (r) => {
        if (r === 'win') { if (s.main.done) return; const out = Game.dungeonFinish(); UI.hud(); UI.panel('🏆 ' + esc(poi.name) + ' completado', UI.list(out) + UI.btn('Continuar', 'poi_go', poi.id, null, { cls: 'primary' }), 'dungeon'); G.Sfx.play('win'); UI.autosave(); }
        else UI.viewDungeon();
      });
    } else if (room.type === 'event') UI.viewEvent(room.ev, () => UI.dgAfter('ok'));
    else if (room.type === 'treasure') { P.gold += room.gold; Game.addItem(room.item, 1); G.Sfx.play('coin'); UI.hud(); UI.panel('💰 Tesoro', '<p>Un cofre cubierto de polvo.</p>' + UI.list(['🪙 +' + room.gold + ' ryo', D.ITEMS[room.item].e + ' ' + D.ITEMS[room.item].n]) + UI.btn('Continuar', 'dg_ok', null, null, { cls: 'primary' }), 'dungeon'); }
    else if (room.type === 'rest') { const d = Game.derived(P); Game.heal(Math.round(d.maxHp * 0.3), Math.round(d.maxEn * 0.3)); G.Sfx.play('heal'); UI.hud(); UI.panel('🕯️ Sala tranquila', '<p>Encuentras un rincón seguro con una vela encendida. Recuperas un poco el aliento.</p>' + UI.list(['❤️ +30% vida', '🔷 +30% energía']) + UI.btn('Continuar', 'dg_ok', null, null, { cls: 'primary' }), 'dungeon'); }
    else { P.hp = Math.max(1, P.hp - room.dmg); G.Sfx.play('hurt'); UI.hud(); UI.panel('⚠️ ¡Trampa!', '<p>Una losa se hunde bajo tus pies y saltan agujas desde las paredes.</p>' + UI.list(['❤️ -' + room.dmg + ' vida']) + UI.btn('Continuar', 'dg_ok', null, null, { cls: 'primary' }), 'dungeon'); }
  };
  A.dg_ok = () => UI.dgAfter('ok');

  /* ================= HOGAR Y FAMILIA ================= */
  A.home = (id) => UI.viewHome(W.poi(S(), id));
  UI.viewHome = function (poi) {
    const s = S(), P = s.player, f = s.family; UI.view = 'home'; UI.hud(); const sp = P.spouse && s.npcs[P.spouse];
    let h = '<p class="muted">Tu hogar en ' + esc(poi.name) + '.</p>';
    if (sp && sp.home === poi.id) h += '<h4>Tu pareja</h4><div class="npclist">' + npcCard(sp, 'home') + '</div>';
    else if (sp) h += '<p class="muted">' + esc(sp.name) + ' aún no vive aquí.</p>';
    h += '<h4>Hijos</h4>' + (f.children.length ? f.children.map((c) => '<div class="relcard">' + G.Port.html({ id: c.id, look: c.look }, 'alegre', { w: 64 }) + '<div><b>' + esc(c.name) + '</b> <small>' + Game.childAge(c) + ' años · ' + So.childTrait(c) + '</small><div class="meter"><i style="width:' + c.bond + '%"></i></div><small>Vínculo ' + c.bond + '/100' + (c.power ? ' · ' + D.POWERS[c.power].e + ' ' + D.POWERS[c.power].n : '') + '</small><div class="chips">' + UI.btn('🎈 Jugar', 'childact', c.id, 'jugar', { cls: 'mini' }) + UI.btn('📘 Enseñar', 'childact', c.id, 'ensenar', { cls: 'mini' }) + UI.btn('🎁 Regalo', 'childact', c.id, 'regalo', { cls: 'mini' }) + '</div></div></div>').join('') : '<p class="muted">Todavía no tienes hijos.</p>');
    if (f.pending) h += '<p class="ok">👶 Hay un bebé en camino (día ' + f.pending.day + ').</p>';
    h += '<div class="chips">' + UI.btn('🛏️ Dormir', 'homesleep', poi.id) + UI.btn('⏳ Pasar una semana', 'homeweek', poi.id)
      + (sp && sp.home === poi.id ? UI.btn('👶 Formar una familia', 'trychild', poi.id) : '') + UI.btn('🧒 Adoptar (100 ryo)', 'adopt', poi.id) + UI.btn('🚪 Salir', 'town', poi.id, null, { cls: 'ghost' }) + '</div>';
    UI.panel('🏠 Mi hogar', h, 'town');
  };
  A.childact = (cid, kind) => { const r = So.childAct(cid, kind); if (r) { UI.toast(r.text); UI.toasts(r.eff); } UI.hud(); UI.viewHome(W.poi(S(), S().family.home)); };
  A.homesleep = (id) => { const r = Game.rest('home'); UI.hud(); UI.autosave(); UI.panel('🛏️ Descanso', '<p>' + r.msg + '</p>' + UI.btn('Continuar', 'home', id, null, { cls: 'primary' }), 'town'); };
  A.homeweek = (id) => { const o = Game.advance(24 * 7); const d = Game.derived(S().player); S().player.hp = d.maxHp; S().player.en = d.maxEn; UI.hud(); UI.autosave(); UI.panel('⏳ Una semana en casa', '<p>Pasáis siete días tranquilos: tareas, risas y charlas junto al fuego.</p>' + UI.list(o.slice(0, 8)) + UI.btn('Continuar', 'home', id, null, { cls: 'primary' }), 'town'); };
  A.trychild = (id) => { const sp = S().npcs[S().player.spouse]; const r = So.tryChild(sp); UI.hud(); UI.toast(r.msg); UI.viewHome(W.poi(S(), id)); };
  A.adopt = (id) => { const r = So.adopt(); UI.toast(r.msg); UI.hud(); G.Sfx.play(r.ok ? 'love' : 'bad'); UI.viewHome(W.poi(S(), id)); };

  UI.familyHtml = function () {
    const s = S(), P = s.player, f = s.family, sp = P.spouse && s.npcs[P.spouse], home = f.home && W.poi(s, f.home);
    let h = '<p>' + (home ? '🏠 Hogar en <b>' + esc(home.name) + '</b>' : 'Aún no tienes casa. Cómprala en cualquier pueblo.') + '</p>';
    if (sp) h += '<h4>Pareja</h4><div class="relcard">' + G.Port.html(sp, sp.mood, { w: 70 }) + '<div><b>' + esc(NPC.fullName(sp)) + '</b><small>' + esc(NPC.jobName(sp)) + ' · ' + sp.age + ' años · afinidad ' + sp.affinity + '</small></div></div>';
    else h += '<p class="muted">No estás casad' + (P.gender === 'm' ? 'o' : 'a') + '. Conoce gente, ayúdala y quizá surja algo…</p>';
    h += '<h4>Hijos (' + f.children.length + ')</h4>' + (f.children.length ? f.children.map((c) => '<div class="relcard">' + G.Port.html({ id: c.id, look: c.look }, 'alegre', { w: 70 }) + '<div><b>' + esc(c.name) + '</b><small>' + Game.childAge(c) + ' años · ' + So.childTrait(c) + (c.asp ? ' · sueña con ser ' + c.asp : '') + ' · vínculo ' + c.bond + (c.power ? ' · ' + D.POWERS[c.power].e + D.POWERS[c.power].n : '') + '</small></div></div>').join('') : '<p class="muted">—</p>');
    return h + (f.pending ? '<p class="ok">👶 Bebé en camino.</p>' : '') + '<p class="hint">Si caes con muerte permanente, un hijo de 14+ años puede heredar tu historia.</p>';
  };
})((window.G = window.G || {}));

</script>
<script>
/* KAZEHANA · arranque */
(function (G) {
  'use strict';
  function boot() {
    G.UI.init();
    const f = document.getElementById('file-import');
    if (f) f.addEventListener('change', (e) => { if (e.target.files[0]) G.UI.importFile(e.target.files[0]); e.target.value = ''; });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.G);

</script>
</body>
</html>
